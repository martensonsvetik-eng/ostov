# Build the static site and publish it to GitHub Pages (brief.md §9: user.github.io/ostov/).
# Repository → Settings → Pages → Source: «GitHub Actions».
# `site` comes from the repository owner, so hreflang, Open Graph and sitemap.xml get the
# real absolute URL. Switching to a custom domain later: set SITE_URL (and `base` in
# astro.config.mjs) — nothing else changes.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        # SITE_URL = https://<owner>.github.io; github.io host names are lower-case, the login may not be.
        run: SITE_URL="https://$(echo "$OWNER" | tr '[:upper:]' '[:lower:]').github.io" npm run build
        env:
          OWNER: ${{ github.repository_owner }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
